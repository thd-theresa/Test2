
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Benutzerverwaltung</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 1200px; margin: 0 auto; padding: 20px; background: #f5f5f5; }
        .card { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,.1); margin-bottom: 24px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
        .btn { padding: 8px 14px; border: none; border-radius: 6px; cursor: pointer; }
        .btn-primary { background: #007bff; color: #fff; }
        .btn-danger { background: #dc3545; color: #fff; }
        .input, select { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 6px; }
        .error { color: #dc3545; margin-top: 8px; }
        a.back-button { background-color: #6c757d; color: white; border: none; padding: 8px 16px; border-radius: 5px; text-decoration: none; display: inline-block; }
    </style>
</head>
<body>


<a class="back-button" th:href="@{/courses}">
    ← Zurück zum Dashboard
</a>


<div class="card">
    <h2>Neuen Benutzer anlegen</h2>
    <p th:if="${error}" class="error" th:text="${error}">Fehler</p>

    <form th:action="@{/admin/users}" th:object="${newUser}" method="post">
        <div class="grid">
            <div>
                <label>E-Mail</label>
                <input class="input" type="email" th:field="*{email}" required/>
            </div>
            <div>
                <label>Passwort</label>
                <input class="input" type="password" th:field="*{password}" required/>
            </div>
            <div>
                <label>Vorname</label>
                <input class="input" type="text" th:field="*{firstName}" required/>
            </div>
            <div>
                <label>Nachname</label>
                <input class="input" type="text" th:field="*{lastName}" required/>
            </div>
            <div>
                <label>Rolle</label>
                <select class="input" th:field="*{role}" required>
                    <option th:each="r : ${roles}" th:value="${r}" th:text="${r}">STUDENT</option>
                </select>
            </div>
            <div>
                <label>Matrikelnummer (nur STUDENT)</label>
                <input class="input" type="number" th:field="*{matriculationNumber}" min="0"/>
            </div>
        </div>
        <div style="margin-top: 16px;">
            <button type="submit" class="btn btn-primary">Speichern</button>
        </div>
    </form>
</div>

<div class="card">
    <h2>Benutzerliste</h2>
    <table style="width:100%; border-collapse: collapse;">
        <thead>
        <tr>
            <th style="text-align:left; padding:8px; border-bottom:1px solid #eee;">Name</th>
            <th style="text-align:left; padding:8px; border-bottom:1px solid #eee;">E-Mail</th>
            <th style="text-align:left; padding:8px; border-bottom:1px solid #eee;">Rolle</th>
            <th style="text-align:left; padding:8px; border-bottom:1px solid #eee;">Matr.-Nr.</th>
            <th style="text-align:left; padding:8px; border-bottom:1px solid #eee;">Aktionen</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="u : ${users}">
            <td th:text="${u.firstName + ' ' + u.lastName}">Max Mustermann</td>
            <td th:text="${u.email}">max@example.com</td>
            <td th:text="${u.role}">STUDENT</td>
            <td th:text="${u.matriculationNumber}">123456</td>
            <td>
                <form th:action="@{|/admin/users/${u.id}/delete|}" method="post">
                    <button type="submit" class="btn btn-danger">Löschen</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
